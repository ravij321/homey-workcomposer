services:
  - type: web
    name: homey-work-insights-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: ./server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SCALEFUSION_API_TOKEN
        sync: false
      - key: SCALEFUSION_API_URL
        value: https://api.scalefusion.com
      - key: CORS_ORIGIN
        sync: false
  - type: web
    name: homey-work-insights-web
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
